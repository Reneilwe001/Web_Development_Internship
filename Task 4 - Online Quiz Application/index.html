<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Online Quiz Application</title>
</head>
<body>
    <h1>Online Quiz Application</h1>
    <p class="quiz-instructions">
        Answer all 10 questions by selecting one option for each question.
        Your final score will be displayed at the end.
    </p>
    <main class="quiz-container">
        <div class="quiz-header">
            <p>Question <span class="question-number">1</span> of <span class="total-question">10</span></p>
            <p>Score: <span class="score">0</span></p>
        </div>
        <div class="quiz-content">
            <h2 class="question">What is the capital of France?</h2>
            <div class="answers">
                <button class="answer">London</button>
                <button class="answer">Paris</button>
                <button class="answer">Rome</button>
                <button class="answer">Madrid</button>
            </div>
            <button class="next-button">Next Question</button>
        </div>
        <div class="quiz-results hidden">
            <h2>Quiz Completed!</h2>
            <p>Your final score is: <span class="final-score">0</span></p>
            <button class="restart-button">Restart Quiz</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
